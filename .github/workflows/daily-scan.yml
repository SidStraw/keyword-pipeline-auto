name: Daily Keyword Scan

on:
  schedule:
    # Run daily at 3:17 AM UTC (避開午夜高峰時段，使用隨機分鐘數分散負載)
    - cron: '17 3 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run keyword discovery script
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          MY_CUSTOM_API_KEY: ${{ secrets.MY_CUSTOM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEED_KEYWORDS: ${{ secrets.SEED_KEYWORDS }}
        run: npx ts-node src/index.ts

# Required GitHub Secrets:
# - SERPER_API_KEY: Your Serper.dev API key for SERP data
# - GAS_WEB_APP_URL: The endpoint for the Google Apps Script Web App
# - MY_CUSTOM_API_KEY: For authenticating the POST request to GAS
# - GEMINI_API_KEY: For generating seed keywords via Google Gemini API
#
# Optional GitHub Secrets:
# - SEED_KEYWORDS: Comma-separated seed keywords (if not provided, Gemini will generate them)
# - DISCORD_WEBHOOK_URL: Discord webhook URL for pipeline notifications
